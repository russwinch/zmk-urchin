# Forager (Seeed XIAO nRF52840). No display.
# ZMK Studio is enabled by default by the forager shield on the left half.
# The RGB LED widget is enabled by the rgbled_adapter shield in build.yaml.

# enable bluetooth
CONFIG_BT=y

# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable deep sleep support
CONFIG_ZMK_SLEEP=y
# 1.800.000 ms = 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
