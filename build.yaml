# Urchin with a Prospector dongle as split central.
#
# The dongle (Seeed XIAO BLE in a Prospector) is the central and the only part
# that talks to the host. Both halves are peripherals, with no display or LEDs.
#
# Flash settings_reset to all three devices before first use.
---
include:
  - board: xiao_ble//zmk
    shield: urchin_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: urchin_dongle_prospector
  - board: nice_nano//zmk
    shield: urchin_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano//zmk
    shield: urchin_right
  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
  # Debug: right half with logging over USB serial. Flash this instead of
  # urchin_right, keep it plugged in, and read logs with e.g.
  #   screen /dev/tty.usbmodem* 115200   (macOS)   or   tio /dev/ttyACM0  (Linux)
  # Debug only: it never sleeps while on USB. Reflash urchin_right afterwards.
  - board: nice_nano//zmk
    shield: urchin_right
    snippet: zmk-usb-logging
    artifact-name: urchin_right_usb_logging
