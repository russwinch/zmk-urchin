# Applies to all parts: dongle, left and right.

# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable deep sleep support (never sleeps while USB powered, so the
# dongle stays awake; only the battery-powered halves sleep)
CONFIG_ZMK_SLEEP=y

# the keyboard disconnects from bluetooth.
# uses very little power, but it may take
# a few seconds to reconnect after waking.
# 1.800.000 ms = 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# "Eager Debouncing"
# Trying to lower the input lag.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Prospector (dongle only, ignored by the halves).
# Set to n if your Prospector was built without the ambient light sensor.
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
# If the dongle build fails with "region 'RAM' overflowed":
# CONFIG_LV_Z_VDB_SIZE=25
