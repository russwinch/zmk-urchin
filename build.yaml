# This file generates the GitHub Actions matrix.
# Each keyboard's keymap is config/<shield>.keymap; both include the shared
# config/keymap.dtsi so layers only need editing in one place.
---
include:
  # --- Urchin (nice!nano v2 + nice!view gem) ---
  - board: nice_nano_v2
    shield: urchin_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: urchin_right nice_view_adapter nice_view_gem
  - board: nice_nano_v2
    shield: settings_reset

  # --- Forager (Seeed XIAO nRF52840, onboard RGB LED) ---
  - board: seeeduino_xiao_ble
    shield: forager_left rgbled_adapter
    snippet: studio-rpc-usb-uart
  - board: seeeduino_xiao_ble
    shield: forager_right rgbled_adapter
  - board: seeeduino_xiao_ble
    shield: settings_reset
